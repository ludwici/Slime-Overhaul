name: Build and release

on:
  push:
    branches:
      - 1.21.1
    tags:
      - 'v*'
  pull_request:
    branches:
      - 1.21.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CrumbsLib access
        env:
          CRUMBSLIB_READ_TOKEN: ${{ secrets.CRUMBSLIB_READ_TOKEN }}
        run: |
          if [ -z "$CRUMBSLIB_READ_TOKEN" ]; then
            echo "::error::Set the CRUMBSLIB_READ_TOKEN repository secret (read access to ludwici/CrumbsLib)."
            exit 1
          fi

      - name: Checkout SlimeOverhaul
        uses: actions/checkout@v4
        with:
          path: slimeoverhaul

      - name: Checkout CrumbsLib
        uses: actions/checkout@v4
        with:
          repository: ludwici/CrumbsLib
          ref: d183e7fd63208c334f769220110ad8ecd6138bc8
          path: CrumbsLib
          token: ${{ secrets.CRUMBSLIB_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            CrumbsLib/**/*.gradle*
            slimeoverhaul/**/*.gradle*

      - name: Publish CrumbsLib to Maven local
        working-directory: CrumbsLib
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon publishToMavenLocal

      - name: Build SlimeOverhaul
        working-directory: slimeoverhaul
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: slimeoverhaul-${{ github.sha }}
          path: slimeoverhaul/build/libs/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          name: slimeoverhaul-${{ github.sha }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true

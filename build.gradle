plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
    id 'java-library'
}

version = "fabric-${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "com.ludwici.crumbslib:CrumbsLib:${minecraft_version}-${crumbslib_version}"
}

sourceSets {
    main {
        java {
            exclude 'com/ludwici/slimeoverhaul/datagen/**'
            exclude 'com/ludwici/slimeoverhaul/compat/jei/**'
            exclude 'com/ludwici/slimeoverhaul/compat/emi/**'
            exclude 'com/ludwici/slimeoverhaul/world/ModBiomeModifiers.java'
        }
        resources {
            srcDir 'src/generated/resources'
            exclude '**/*.bbmodel', '**/*.psd'
            exclude 'data/**/neoforge/**'
            exclude 'data/**/data_maps/**'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
